name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SVN for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run xml_merger unit tests
        run: python tests/test_merger.py

      - name: Run xml_differ unit tests
        run: python tests/test_differ.py

      - name: Run updater unit tests
        run: python tests/test_updater.py

      - name: Run /api/merge HTTP tests
        run: python tests/test_api_merge.py

      - name: Run XML and API regressions
        run: python tests/test_regressions.py

      - name: Run real SVN integration tests
        run: python tests/test_svn_update.py

      - name: Run frontend regressions
        run: node --test tests/test_frontend.js
